<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIA Absensi Sekolah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-5">
                <div class="card login-card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="login-icon mb-3">
                                <i class="fas fa-school fa-3x text-primary"></i>
                            </div>
                            <h3 class="fw-bold text-dark">SIA Absensi</h3>
                            <p class="text-muted">Sistem Informasi Absensi Sekolah</p>
                        </div>

                        <ul class="nav nav-pills nav-justified mb-4" role="tablist">
                            <li class="nav-item">
                                <button class="nav-link active fw-bold" data-bs-toggle="pill" data-bs-target="#pills-siswa" type="button">Siswa</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link fw-bold" data-bs-toggle="pill" data-bs-target="#pills-admin" type="button">Admin</button>
                            </li>
                        </ul>

                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="pills-siswa">
                                <form id="formLoginSiswa">
                                    <div class="mb-3">
                                        <label class="form-label">Email / NIS</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                                            <input type="text" class="form-control border-start-0" id="siswaEmail" placeholder="Masukkan Email atau NIS" required>
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                            <input type="password" class="form-control border-start-0" id="siswaPassword" placeholder="Masukkan Password" required>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3 shadow-sm btn-hover-effect">Masuk sebagai Siswa</button>
                                </form>
                            </div>
                            <div class="tab-pane fade" id="pills-admin">
                                <form id="formLoginAdmin">
                                    <div class="mb-3">
                                        <label class="form-label">Username Admin</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-user-shield text-muted"></i></span>
                                            <input type="text" class="form-control border-start-0" id="adminUsername" placeholder="Masukkan Username" required>
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                            <input type="password" class="form-control border-start-0" id="adminPassword" placeholder="Masukkan Password" required>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-dark w-100 py-2 fw-bold rounded-3 shadow-sm btn-hover-effect">Masuk sebagai Admin</button>
                                </form>
                            </div>
                        </div>
                        <div class="text-center mt-4">
                            <small class="text-muted">&copy; 2026 SIA Absensi. All rights reserved.</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
